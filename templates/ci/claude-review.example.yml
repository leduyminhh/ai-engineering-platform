# Ví dụ CI: review PR chỉ đọc bằng skill aip, kết quả ra job summary (không đăng bình luận lên PR).
# Đây là mẫu để sao chép và chỉnh, aip không tự cài vào workflow của bạn.
# Các tên đầu vào bên dưới đối chiếu tài liệu ngày 2026-10-22:
# https://code.claude.com/docs/en/github-actions và https://code.claude.com/docs/en/headless
# [Unverified] Tên đầu vào của Action có thể đổi theo phiên bản; hãy kiểm lại với action.yml trước khi dùng.
name: claude-review

on:
  # Dùng pull_request, không dùng pull_request_target: PR từ fork không được chạy với secret của repo.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Chỉ chạy PR cùng repo vì secret ANTHROPIC_API_KEY không có sẵn cho PR từ fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Chỉ đọc. [Unverified] Action có thể đòi thêm `id-token: write` cho xác thực GitHub App mặc định;
    # ví dụ này cố ý không cấp, bạn phải tự kiểm trong tài liệu trước khi nâng quyền.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Thay <full-40-char-commit-sha> bằng SHA đầy đủ 40 ký tự của release bạn đã rà soát; không dùng tag trôi.
      - uses: actions/checkout@<full-40-char-commit-sha>
        with:
          # Hai commit đủ để HEAD^1..HEAD là diff của PR trên merge ref mà pull_request checkout.
          fetch-depth: 2
          persist-credentials: false

      - uses: anthropics/claude-code-action@<full-40-char-commit-sha>
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Marketplace `ai-engineering-platform` build bằng `node cli/dist.mjs` thành nhánh `dist`;
          # điền URL Git của nhánh `dist` bạn đã đẩy lên (giá trị dưới là chỗ giữ).
          plugin_marketplaces: https://example.com/your-org/ai-engineering-platform.git
          plugins: backend@ai-engineering-platform
          # [Unverified] display_report chỉ thấy trong action.yml, chưa thấy trong ví dụ của tài liệu.
          display_report: true
          # Prompt cố định, không nội suy title/body/head.ref của PR để tránh prompt injection từ người mở PR.
          prompt: "/backend:backend-code-review HEAD^1..HEAD"
          # --allowedTools là danh sách cho phép tối thiểu để đọc diff. [Unverified] Có thể cần thêm `Skill`
          # để skill chạy được; nếu vậy, bạn tự thêm sau khi kiểm và chấp nhận phần rủi ro tăng thêm.
          # [Unverified] --max-budget-usd là cờ print-mode, chưa thấy trong ví dụ của Action nên chỉ là truyền tiếp.
          claude_args: --permission-mode dontAsk --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *)" --max-turns 20 --max-budget-usd 2
